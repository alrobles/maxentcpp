name: CRAN Preflight Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  cran-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: CRAN preflight (ubuntu, release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: true
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check --as-cran
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'
          upload-snapshots: true

      - name: Show check results
        if: always()
        run: |
          echo "--- CRAN Preflight Summary ---"
          if [ -d check ]; then
            for f in check/*.Rcheck/00check.log; do
              if [ -f "$f" ]; then
                echo "=== $f ==="
                cat "$f"
              fi
            done
            for f in check/*.Rcheck/00install.out; do
              if [ -f "$f" ]; then
                echo "=== $f ==="
                tail -30 "$f"
              fi
            done
          fi
